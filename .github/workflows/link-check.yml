name: Weekly leaflet link check

on:
  push:
    paths: ["leaflets.json", "source/make_thumbs.py"]
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install pillow
      - name: Check every leaflet link
        run: python3 source/make_thumbs.py
      - name: Save the link report
        run: |
          git config user.name "leaflet-qr-bot"
          git config user.email "leaflet-qr-bot@users.noreply.github.com"
          git add -A link-report.md
          for d in thumbs pdfs; do if [ -e "$d" ] || git ls-files --error-unmatch "$d" >/dev/null 2>&1; then git add -A "$d"; fi; done
          git diff --cached --quiet || (git commit -m "Update leaflet link report" && git push)
      # Broken links: open an issue (GitHub emails the repository owner), or add to the open one.
      # When every link works again, the issue closes itself.
      - name: Email me if links are broken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Leaflet links need checking"
          OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -f link-problems.flag ]; then
            if [ -n "$OPEN" ]; then gh issue comment "$OPEN" --body-file link-report.md
            else gh issue create --title "$TITLE" --body-file link-report.md; fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "All leaflet links worked on the latest check."
          fi
